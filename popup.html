<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WordMine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-container">

    <!-- Header matching Redesign@2x.png -->
    <header class="app-header">
      <div class="brand-left">
        <div class="brand-logo">
          <img src="icons/icon48.png" alt="W" class="brand-icon-img" />
        </div>
        <div class="brand-text">
          <h1 class="brand-title">WordMine</h1>
          <p class="brand-subtitle">Coursera transcript miner</p>
        </div>
      </div>
      <div class="brand-right">
        <span class="free-badge">Free</span>
      </div>
    </header>

    <main class="app-main">

      <!-- Output format selector -->
      <section class="section-group">
        <label class="section-label">Output format</label>
        <div class="format-segmented-control">
          <label class="format-option">
            <input type="radio" name="format" value="docx" checked />
            <span class="format-pill">
              <span class="check-icon">✓</span>
              <span class="format-name">DOCX</span>
            </span>
          </label>
          <label class="format-option">
            <input type="radio" name="format" value="pdf" />
            <span class="format-pill">
              <span class="check-icon">✓</span>
              <span class="format-name">PDF</span>
            </span>
          </label>
          <label class="format-option">
            <input type="radio" name="format" value="txt" />
            <span class="format-pill">
              <span class="check-icon">✓</span>
              <span class="format-name">TXT</span>
            </span>
          </label>
        </div>
      </section>

      <!-- Auto-advance & Content Filter Card -->
      <section class="control-card">
        
        <!-- Auto-advance row matching Redesign@2x.png -->
        <div class="auto-advance-row">
          <div class="auto-advance-info">
            <h2 class="auto-advance-title" id="modeTitle">Auto-advance: Off</h2>
            <p class="auto-advance-desc" id="modeDesc">You click Next lesson yourself after each page.</p>
          </div>
          <label class="switch-toggle" title="Toggle Auto-advance">
            <input type="checkbox" id="autoToggle" />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <div class="card-separator"></div>

        <!-- Content to mine: Symmetrical 3-chip filter on 1 clean line -->
        <div class="content-filter-block">
          <span class="filter-header-label">Content to mine</span>
          <div class="filter-chips-grid">
            <label class="filter-chip">
              <input type="checkbox" id="includeVideos" checked />
              <span class="chip-content">
                <span class="chip-check">✓</span>
                <span class="chip-text">Videos</span>
              </span>
            </label>
            <label class="filter-chip">
              <input type="checkbox" id="includeReadings" checked />
              <span class="chip-content">
                <span class="chip-check">✓</span>
                <span class="chip-text">Readings</span>
              </span>
            </label>
            <label class="filter-chip">
              <input type="checkbox" id="includeQuizzes" />
              <span class="chip-content">
                <span class="chip-check">✓</span>
                <span class="chip-text">Quizzes</span>
              </span>
            </label>
          </div>
        </div>

      </section>

      <!-- Primary & Contextual Action Buttons -->
      <div class="action-buttons-group">
        <button class="primary-btn" id="extractBtn">
          Mine this lesson
        </button>
        <button class="secondary-btn" id="nextBtn" style="display:none;">
          Next lesson →
        </button>
        <button class="danger-btn" id="stopBtn" style="display:none;">
          ⏹ Stop mining
        </button>
      </div>

      <!-- Curriculum Explorer (Module & Lesson Selector) -->
      <section class="control-card curriculum-card">
        <div class="curriculum-header-row">
          <div class="curriculum-title-wrap">
            <span class="curriculum-icon">📚</span>
            <div>
              <h3 class="curriculum-title">Module &amp; Lesson Selector</h3>
              <p class="curriculum-subtitle">Select specific lessons to mine</p>
            </div>
          </div>
          <button class="ghost-btn-sm" id="scanCurriculumBtn">
            🔍 Scan
          </button>
        </div>

        <div class="curriculum-drawer" id="curriculumDrawer" style="display:none;">
          <div class="curriculum-toolbar">
            <span class="curriculum-count" id="curriculumStats">0 selected</span>
            <div class="curriculum-quick-pills">
              <button class="quick-pill" id="btnFilterAll">All</button>
              <button class="quick-pill" id="btnFilterVideos">Videos</button>
              <button class="quick-pill" id="btnFilterReadings">Readings</button>
              <button class="quick-pill" id="btnFilterNone">None</button>
            </div>
          </div>

          <div class="curriculum-tree-container" id="curriculumList">
            <div class="curriculum-empty">Click <b>Scan</b> to discover all course modules and lessons.</div>
          </div>

          <button class="primary-btn-sm" id="mineSelectedBtn" style="display:none;">
            Mine Selected (<span id="selectedCountBadge">0</span>)
          </button>
        </div>
      </section>

      <!-- Live Mining Feed & Download -->
      <section class="control-card feed-card" id="logSection" style="display:none;">
        <div class="feed-header">
          <div class="feed-title-wrap">
            <span class="pulse-indicator"></span>
            <span class="feed-title">Mining Feed</span>
          </div>
          <button class="clear-link-btn" id="clearBtn" title="Clear log">Clear</button>
        </div>
        <div class="feed-box" id="logBox"></div>
        <div class="feed-actions">
          <button class="primary-btn download-btn" id="downloadBtn" style="display:none;">
            ⬇ Download all (.zip)
          </button>
        </div>
      </section>

      <!-- Status Bar matching Redesign@2x.png -->
      <footer class="app-status-bar">
        <span class="status-dot dot-ready" id="statusIndicator"></span>
        <span class="status-message" id="statusText">Ready. Lesson page detected.</span>
      </footer>

    </main>

  </div>

  <script src="jszip.min.js"></script>
  <script src="docx.min.js"></script>
  <script src="pdfobject.min.js"></script>
  <script src="html2pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
