<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WordMine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-wrapper">

    <!-- Neo-Brutalist High-Contrast Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-frame">
          <img src="icons/icon48.png" alt="WordMine" class="logo-img" />
        </div>
        <div class="header-text">
          <div class="brand-row">
            <h1 class="brand-name">WORDMINE</h1>
            <span class="pro-tag">FREE</span>
          </div>
          <p class="brand-sub">Coursera Transcript Miner</p>
        </div>
      </div>
    </header>

    <main class="main-body">

      <!-- Step 1: Format Selection -->
      <section class="neo-card">
        <div class="card-title-row">
          <span class="step-badge">1</span>
          <h2 class="card-heading">OUTPUT FORMAT</h2>
        </div>
        <div class="format-grid">
          <label class="format-btn">
            <input type="radio" name="format" value="docx" checked />
            <span class="format-box">
              <span class="format-icon">📄</span>
              <span class="format-text">DOCX</span>
            </span>
          </label>
          <label class="format-btn">
            <input type="radio" name="format" value="pdf" />
            <span class="format-box">
              <span class="format-icon">📑</span>
              <span class="format-text">PDF</span>
            </span>
          </label>
          <label class="format-btn">
            <input type="radio" name="format" value="txt" />
            <span class="format-box">
              <span class="format-icon">📝</span>
              <span class="format-text">TXT</span>
            </span>
          </label>
        </div>
      </section>

      <!-- Step 2: Extraction Mode -->
      <section class="neo-card">
        <div class="card-title-row">
          <span class="step-badge">2</span>
          <h2 class="card-heading">ADVANCE MODE</h2>
        </div>
        <div class="mode-row">
          <div class="mode-info">
            <span class="mode-title">Auto-Advance</span>
            <span class="mode-desc" id="modeHint">Manual: click Next Lesson yourself after each page.</span>
          </div>
          <label class="neo-toggle">
            <input type="checkbox" id="autoToggle" />
            <span class="toggle-track">
              <span class="toggle-knob"></span>
            </span>
          </label>
        </div>
      </section>

      <!-- Action Buttons -->
      <div class="button-stack">
        <button class="neo-btn btn-primary" id="extractBtn">
          <span class="btn-icon">⛏</span>
          <span class="btn-label">MINE THIS LESSON</span>
        </button>
        <button class="neo-btn btn-secondary" id="nextBtn" style="display:none;">
          NEXT LESSON →
        </button>
        <button class="neo-btn btn-stop" id="stopBtn" style="display:none;">
          ⏹ STOP MINING
        </button>
      </div>

      <!-- Mining Feed / Log Section -->
      <section class="neo-card feed-card" id="logSection" style="display:none;">
        <div class="feed-header-row">
          <div class="feed-title-wrap">
            <span class="live-dot"></span>
            <span class="feed-title">MINING FEED</span>
          </div>
          <span class="feed-badge">LIVE</span>
        </div>
        <div class="log-container" id="logBox"></div>
        <div class="feed-btn-row">
          <button class="neo-btn btn-download" id="downloadBtn" style="display:none;">
            ⬇ DOWNLOAD ALL (.ZIP)
          </button>
          <button class="neo-btn btn-clear" id="clearBtn" style="display:none;">
            ✕ CLEAR LOG
          </button>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>WordMine v2.0 • 100% Free &amp; Open Source</span>
    </footer>

  </div>

  <script src="jszip.min.js"></script>
  <script src="docx.min.js"></script>
  <script src="pdfobject.min.js"></script>
  <script src="html2pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
